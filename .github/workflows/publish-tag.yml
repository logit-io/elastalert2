# Replaces Docker Hub Autobuilds tag builds. Autobuilds are retired on
# 1 April 2027:
# https://docs.docker.com/docker-hub/repos/manage/builds/migrate/
# The image tag is the git tag, as Docker Hub Autobuild published it.

name: Publish image tag

on:
  push:
    tags:
      - "2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and push
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: logit/elastalert2

jobs:
  publish:
    # Upstream copies of this fork must not publish to Logit's Docker Hub.
    if: github.repository_owner == 'logit-io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Check tag
        id: tag
        env:
          TAG_PATTERN: '^2\.[0-9]+\.[0-9]+$'
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ ! "$tag" =~ $TAG_PATTERN ]]; then
            echo "Tag ${tag} is outside the release pattern. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ env.IMAGE }}:${tag}"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.tag.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        if: steps.tag.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Summary
        if: steps.tag.outputs.publish == 'true'
        run: |
          {
            echo "### Published image"
            echo ""
            echo "- **Image**: \`${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
